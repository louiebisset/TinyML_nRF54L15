# prj.conf — Gesture Recognition (Edge Impulse)
# Edge Impulse SDK pipeline

# ── 1. AI ENGINE & C++ ────────────────────────────────────────────────────────
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_EXTERNAL_LIBCPP=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# ── 2. MEMORY & STACK ─────────────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# ── 3. HARDWARE ───────────────────────────────────────────────────────────────
CONFIG_GPIO=y
CONFIG_I2C=y
# ── 5. LOGGING & CONSOLE ──────────────────────────────────────────────────────
CONFIG_LOG=n
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_NRFX_CLOCK=y

