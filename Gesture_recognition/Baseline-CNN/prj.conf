# prj.conf — Gesture Recognition (Model A / Model B)
# TensorFlow Lite Micro pipeline

# ── 1. AI ENGINE & C++ ────────────────────────────────────────────────────────
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_EXTERNAL_LIBCPP=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_FPU=y
CONFIG_TENSORFLOW_LITE_MICRO=y
CONFIG_SIZE_OPTIMIZATIONS=y

# ── 2. MEMORY & STACK ─────────────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# ── 3. HARDWARE ───────────────────────────────────────────────────────────────
CONFIG_GPIO=y
CONFIG_I2C=y

# ── 4. POWER MANAGEMENT ───────────────────────────────────────────────────────
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y


# Prevents the kernel from waking up every 1ms just to increment a counter.
CONFIG_TICKLESS_KERNEL=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=32768


CONFIG_NRF_GRTC_TIMER=y

