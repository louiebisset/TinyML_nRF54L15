# ── 1. AI ENGINE & C++ ────────────────────────────────────────────────────────
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_EXTERNAL_LIBCPP=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_FPU=y

# ── 2. MEMORY & STACK FIXES ───────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=2048
CONFIG_BT_HCI_TX_STACK_SIZE=2048
CONFIG_MPSL_WORK_STACK_SIZE=2048

# ── 3. HARDWARE & AUDIO ───────────────────────────────────────────────────────
CONFIG_GPIO=y
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
CONFIG_REGULATOR=y
# ── 4. BLUETOOTH (Explicitly kill the clash) ──────────────────────────────────
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="XIAO_SENSE"

# 1. Disable the Zephyr Open Source Controller (The cause of the error)
CONFIG_BT_CTLR=n
CONFIG_BT_LL_SW_SPLIT=n

# 2. Enable the Nordic SoftDevice Controller (The one for nRF54L)
CONFIG_BT_LL_SOFTDEVICE=y

# 3. Enable Bluetooth management features
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# ── 5. POWER MANAGEMENT ───────────────────────────────────────────────────────
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_TICKLESS_KERNEL=y
CONFIG_REGULATOR=y

# ── 6. LOGGING & CONSOLE (Total Silence) ──────────────────────────────────────
CONFIG_LOG=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=y