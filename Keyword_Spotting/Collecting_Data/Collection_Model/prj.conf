# --- LOGGING & CONSOLE ---
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_GPIO=y

# --- AUDIO ---
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# --- MEMORY (AI needs this) ---
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# --- C++ & AI SUPPORT (The Critical Part) ---
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_FPU=y

# REQUIRED: Tell Zephyr to use the full C++ Standard Library
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_NEWLIB_LIBC=y

# Enable TensorFlow
CONFIG_TENSORFLOW_LITE_MICRO=y